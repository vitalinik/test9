version: 0.2

phases:
  pre_build:
    commands:
      - echo "Logging in to Amazon ECR ($AWS_DEFAULT_REGION)..."
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - REPOSITORY_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$IMAGE_REPO_NAME
      - IMAGE_TAG=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c1-8)
      - if [ -z "$IMAGE_TAG" ] || [ "$IMAGE_TAG" = "latest" ]; then IMAGE_TAG=build-$CODEBUILD_BUILD_NUMBER; fi
  build:
    commands:
      - echo "Build started on `date`"
      - echo "Building the Docker image..."
      - docker build -t $REPOSITORY_URI:latest -t $REPOSITORY_URI:$IMAGE_TAG .
  post_build:
    commands:
      - echo "Build completed on `date`"
      - echo "Pushing the Docker image..."
      - docker push $REPOSITORY_URI:latest
      - docker push $REPOSITORY_URI:$IMAGE_TAG
      - echo "Writing image URI for CodeDeploy hooks..."
      - echo $REPOSITORY_URI:$IMAGE_TAG > image_uri.txt
      - cat image_uri.txt

artifacts:
  files:
    - appspec.yml
    - image_uri.txt
    - scripts/**/*
