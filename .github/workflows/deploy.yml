name: Deploy Lambda Functions

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy createOrder
        run: |
          cd lambdas
          zip -r ../createOrder.zip cmtr_5bf61784_lambda_createOrder
          cd ..
          aws lambda update-function-code \
            --function-name cmtr_5bf61784_lambda_createOrder \
            --zip-file fileb://createOrder.zip
          aws lambda wait function-updated \
            --function-name cmtr_5bf61784_lambda_createOrder

      - name: Deploy reserveStock
        run: |
          cd lambdas
          zip -r ../reserveStock.zip cmtr_5bf61784_lambda_reserveStock
          cd ..
          aws lambda update-function-code \
            --function-name cmtr_5bf61784_lambda_reserveStock \
            --zip-file fileb://reserveStock.zip
          aws lambda wait function-updated \
            --function-name cmtr_5bf61784_lambda_reserveStock

      - name: Deploy sendNotification
        run: |
          cd lambdas
          zip -r ../sendNotification.zip cmtr_5bf61784_lambda_sendNotification
          cd ..
          aws lambda update-function-code \
            --function-name cmtr_5bf61784_lambda_sendNotification \
            --zip-file fileb://sendNotification.zip
          aws lambda wait function-updated \
            --function-name cmtr_5bf61784_lambda_sendNotification